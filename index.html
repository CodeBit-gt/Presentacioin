<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBit | Desarrollo de Software</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #172D4D;
            --navy-deep: #0F1E36;
            --navy-card: rgba(19, 38, 66, 0.85);
            --ivory: #F4F1EA;
            --ivory-muted: rgba(244, 241, 234, 0.72);
            --ivory-border: rgba(244, 241, 234, 0.14);
            --gold: #B58A45;
            --gold-hover: #C69950;
            --gold-soft: rgba(181, 138, 69, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top right, #213F6B 0%, var(--navy) 48%, var(--navy-deep) 100%);
            color: var(--ivory);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 20px 64px;
            -webkit-font-smoothing: antialiased;
        }

        /* Contenedor Principal */
        .card {
            background: var(--navy-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--ivory-border);
            border-radius: 24px;
            padding: 40px 28px 34px;
            width: 100%;
            max-width: 390px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(7, 15, 28, 0.55);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(181, 138, 69, 0.35);
        }

        /* Logo / Avatar */
        .logo-wrapper {
            width: 104px;
            height: 104px;
            margin: 0 auto 20px;
            border-radius: 24px;
            padding: 3px;
            background: linear-gradient(145deg, var(--gold), rgba(181, 138, 69, 0.3));
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 21px;
            object-fit: cover;
            display: block;
            background-color: var(--navy);
        }

        /* Encabezado */
        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--ivory);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .accent-line {
            width: 42px;
            height: 3px;
            background-color: var(--gold);
            border-radius: 2px;
            margin: 0 auto 12px;
        }

        .job-title {
            color: var(--ivory-muted);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Contenedor de Botones */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        /* Fila Principal: WhatsApp + Guardar Contacto */
        .primary-action-group {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.25s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-left i {
            font-size: 1.15rem;
            width: 20px;
            text-align: center;
        }

        .btn-arrow {
            font-size: 0.85rem;
            opacity: 0.65;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .btn:hover .btn-arrow {
            transform: translateX(3px);
            opacity: 1;
        }

        /* Botón 1: WhatsApp Empresarial (Antique Gold) */
        .btn-whatsapp {
            background-color: var(--gold);
            color: var(--ivory);
            justify-content: center;
            box-shadow: 0 6px 20px rgba(181, 138, 69, 0.28);
        }

        .btn-whatsapp:hover {
            background-color: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(181, 138, 69, 0.4);
        }

        /* Botón Guardar Contacto (Soft Ivory) */
        .btn-save {
            background-color: var(--ivory);
            color: var(--navy);
            padding: 14px 16px;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.88rem;
        }

        .btn-save:hover {
            background-color: #FFFFFF;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(244, 241, 234, 0.22);
        }

        /* Botones Secundarios (Web, Instagram, Facebook) */
        .btn-secondary {
            background-color: rgba(244, 241, 234, 0.04);
            border-color: var(--ivory-border);
            color: var(--ivory);
        }

        .btn-secondary .btn-left i {
            color: var(--gold);
        }

        .btn-secondary:hover {
            background-color: var(--gold-soft);
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        /* Toast de confirmación al guardar contacto */
        .toast {
            position: fixed;
            bottom: 52px;
            left: 50%;
            transform: translateX(-50%) translateY(15px);
            background-color: var(--ivory);
            color: var(--navy);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            color: var(--gold);
        }

        /* Footer */
        .creator-footer {
            position: fixed;
            bottom: 16px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.78rem;
            color: rgba(244, 241, 234, 0.45);
            pointer-events: none;
        }

        .creator-footer a {
            pointer-events: auto;
            color: var(--gold);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.25s ease;
        }

        .creator-footer a:hover {
            color: var(--ivory);
            text-decoration: underline;
        }

        @media (max-width: 360px) {
            .primary-action-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="logo-wrapper">
            <img src="codebit-icono-512.png" alt="Logo CodeBit" class="profile-img">
        </div>

        <h1>CodeBit</h1>
        <div class="accent-line"></div>
        <p class="job-title">Desarrollo de Software</p>

        <div class="links-container">
            <!-- 1. WhatsApp Empresarial + Guardar Contacto -->
            <div class="primary-action-group">
                <a href="https://wa.me/50244625477?text=Hola%20CodeBit%2C%20me%20gustar%C3%ADa%20más%20informaci%C3%B3n." class="btn btn-whatsapp" target="_blank" rel="noopener">
                    <span class="btn-left">
                        <i class="fab fa-whatsapp"></i>
                        <span>WhatsApp</span>
                    </span>
                </a>

                <button type="button" id="saveContactBtn" class="btn btn-save" title="Guardar contacto en tu celular">
                    <i class="fas fa-user-plus"></i>
                    <span>Guardar</span>
                </button>
            </div>

            <!-- 2. Página Web -->
            <a href="https://codebit-gt.github.io/" class="btn btn-secondary" target="_blank" rel="noopener">
                <span class="btn-left">
                    <i class="fas fa-globe"></i>
                    <span>Sitio Web</span>
                </span>
                <i class="fas fa-arrow-right btn-arrow"></i>
            </a>

            <!-- 3. Instagram -->
            <a href="https://www.instagram.com/codebitgt/" class="btn btn-secondary" target="_blank" rel="noopener">
                <span class="btn-left">
                    <i class="fab fa-instagram"></i>
                    <span>Instagram</span>
                </span>
                <i class="fas fa-arrow-right btn-arrow"></i>
            </a>

            <!-- 4. Facebook -->
            <a href="https://www.facebook.com/codebitgt/" class="btn btn-secondary" target="_blank" rel="noopener">
                <span class="btn-left">
                    <i class="fab fa-facebook-f"></i>
                    <span>Facebook</span>
                </span>
                <i class="fas fa-arrow-right btn-arrow"></i>
            </a>
        </div>
    </main>

    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span>Descargando contacto de CodeBit...</span>
    </div>

    <footer class="creator-footer">
        <i class="fas fa-code"></i> Desarrollado por
        <a href="https://codebit-gt.github.io/" target="_blank" rel="noopener">CodeBit</a>
    </footer>

    <script>
        document.getElementById('saveContactBtn').addEventListener('click', function () {
            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'N:CodeBit;;;;',
                'FN:CodeBit',
                'ORG:CodeBit',
                'TITLE:Desarrollo de Software',
                'TEL;TYPE=WORK,VOICE:+50244625477',
                'URL:https://codebit-gt.github.io/',
                'X-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/codebitgt/',
                'X-SOCIALPROFILE;TYPE=facebook:https://www.facebook.com/codebitgt/',
                'NOTE:Páginas web que convierten visitas en clientes',
                'END:VCARD'
            ].join('\r\n');

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'CodeBit.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        });
    </script>
</body>
</html>
